server:
  port: 8080

spring:
  application:
    name: field-notes-backend

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:mysql://localhost:3306/field_notes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

fieldnotes:
  jwt-secret: "change-me-in-production-please-use-a-long-random-secret-key-at-least-32-bytes"
  jwt-expiration-ms: 86400000
  upload-dir: "./uploads"
